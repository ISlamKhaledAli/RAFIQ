name = "rafiq-license-server"
main = "src/index.ts"
compatibility_date = "2024-05-01"

# Environment Variables
[vars]
ENVIRONMENT = "production"

# SECRETS (Audit F-05): never commit secret values to this file.
# 1. Generate keys locally (git-ignored output):   node scripts/setup-secrets.mjs
# 2. Upload them to Cloudflare once:                npx wrangler secret bulk .secrets/production.secrets.json
#    -> APP_API_KEY, ADMIN_SECRET, LICENSE_PRIVATE_KEY (RSA private key used to sign licenses)
# Local `wrangler dev` reads the same values from the git-ignored .dev.vars file.
# The old values that were committed here are compromised and must not be reused.

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "rafiq-licenses"
database_id = "14bc3b73-bbe4-46cd-aa7f-8c9d1f2c2a2f"
migrations_table = "d1_migrations"
migrations_dir = "migrations"
