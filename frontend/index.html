<!doctype html>
<html lang="ar" dir="rtl" style="background-color: #f8fafc; height: 100%; margin: 0; padding: 0;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="author" content="ISlam Khaled Ali" />
    <meta name="copyright" content="Copyright © 2026 ISlam Khaled Ali. All rights reserved." />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>رفيق POS — ISlam Khaled Ali</title>
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('rafiq_theme_mode');
          var isDark = false;
          if (mode === 'dark') {
            isDark = true;
          } else if (mode === 'system') {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
              isDark = true;
            }
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.backgroundColor = '#0C110F';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.backgroundColor = '#F3F5F2';
          }
        } catch (e) {}
      })();
    </script>
    <style>
      /* Clean Light Canvas Reset */
      html, body {
        background-color: #f8fafc;
        color: #0f172a;
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      }
      .dark html, .dark body {
        background-color: #0c110f !important;
        color: #f1f5f9 !important;
      }
      #root {
        height: 100%;
        width: 100%;
      }
      /* Instant Branded HTML Splash Screen (Light Luxury Brand) */
      .initial-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        background: #f8fafc;
        user-select: none;
      }
      .initial-splash-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 36px 44px;
        background: #ffffff;
        border: 1px solid #dce1dc;
        border-top: 4px solid #006d41;
        border-radius: 20px;
        box-shadow: 0 16px 36px rgba(0, 55, 45, 0.08);
        max-width: 460px;
        width: 90%;
        text-align: center;
      }
      .initial-splash-logo {
        height: 60px;
        max-width: 240px;
        object-fit: contain;
        margin-bottom: 14px;
      }
      .initial-splash-title {
        font-size: 22px;
        font-weight: 800;
        color: #00372d;
        margin: 0;
        letter-spacing: -0.5px;
      }
      .initial-splash-sub {
        font-size: 13px;
        color: #006d41;
        margin-top: 6px;
        font-weight: 600;
      }
      .initial-spinner-wrap {
        position: relative;
        width: 40px;
        height: 40px;
        margin: 20px 0 10px 0;
      }
      .initial-spinner-ring {
        position: absolute;
        inset: 0;
        border: 3px solid rgba(0, 109, 65, 0.12);
        border-top-color: #006d41;
        border-right-color: #34d399;
        border-radius: 50%;
        animation: initialSpin 0.9s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
      }
      .initial-progress-bar {
        width: 200px;
        height: 4px;
        background: #f1f5f4;
        border-radius: 999px;
        overflow: hidden;
        margin-top: 10px;
      }
      .initial-progress-fill {
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, #004d3f, #006d41, #34d399);
        background-size: 200% 100%;
        animation: initialShimmer 1.5s linear infinite;
        border-radius: 999px;
      }
      .initial-splash-status {
        font-size: 12px;
        color: #52605d;
        margin-top: 16px;
        margin-bottom: 0;
        font-weight: 500;
      }
      .initial-splash-badge {
        display: inline-block;
        margin-top: 20px;
        padding: 5px 14px;
        background: #eaf5ee;
        color: #006d41;
        font-size: 11px;
        font-weight: 700;
        border-radius: 999px;
        border: 1px solid rgba(0, 109, 65, 0.15);
      }
      .dark .initial-splash {
        background: #0c110f !important;
      }
      .dark .initial-splash-card {
        background: #131b18 !important;
        border-color: #26342f !important;
        border-top-color: #10b981 !important;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5) !important;
      }
      .dark .initial-splash-title {
        color: #f1f5f9 !important;
      }
      .dark .initial-splash-sub {
        color: #34d399 !important;
      }
      .dark .initial-splash-status {
        color: #94a3b8 !important;
      }
      .dark .initial-splash-badge {
        background: #092e20 !important;
        color: #34d399 !important;
        border-color: rgba(52, 211, 153, 0.25) !important;
      }
      .dark .initial-progress-bar {
        background: #1a2420 !important;
      }
      @keyframes initialSpin {
        to { transform: rotate(360deg); }
      }
      @keyframes initialShimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
    </style>
  </head>
  <body class="bg-canvas text-ink select-none antialiased">
    <div id="root">
      <div class="initial-splash">
        <div class="initial-splash-card">
          <img src="/logo_full.png" onerror="this.onerror=null;this.src='/logo.png';" alt="رفيق POS" class="initial-splash-logo" />
          <h1 class="initial-splash-title">رفيق POS</h1>
          <p class="initial-splash-sub">نظام نقاط البيع وإدارة المتاجر ومحلات التجزئة</p>
          <div class="initial-spinner-wrap">
            <div class="initial-spinner-ring"></div>
          </div>
          <div class="initial-progress-bar">
            <div class="initial-progress-fill"></div>
          </div>
          <p class="initial-splash-status">جاري تشغيل مساحة العمل والاتصال بالسجلات المحلية...</p>
          <span class="initial-splash-badge">نظام أوفلاين معتمد • إصدار التجزئة الاحترافي</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
