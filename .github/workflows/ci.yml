name: Rafiq POS CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (tag in the trailing comment) for supply-chain safety.
jobs:
  # ---------------------------------------------------------------------------------------------
  # Fast feedback: React UI (lint, type-check + build, unit tests)
  # ---------------------------------------------------------------------------------------------
  # Pure Node jobs run on Linux (faster start and install than windows-latest); both suites were verified
  # on a case-sensitive filesystem.
  frontend:
    name: Frontend (lint, build, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout Repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        # Do not leave the GITHUB_TOKEN in .git/config for later steps (npm/nuget/msbuild run third-party code)
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Frontend Dependencies & Linting
      working-directory: frontend
      run: |
        npm ci
        npm run lint
        npm run build

    - name: Frontend Test Suite
      working-directory: frontend
      run: npm test

  # ---------------------------------------------------------------------------------------------
  # License server (Cloudflare Worker) tests
  # ---------------------------------------------------------------------------------------------
  license-server:
    name: License server tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout Repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        # Do not leave the GITHUB_TOKEN in .git/config for later steps (npm/nuget/msbuild run third-party code)
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: license-server/package-lock.json

    - name: License Server Tests
      working-directory: license-server
      run: |
        npm ci
        npm test

  # ---------------------------------------------------------------------------------------------
  # C# host: Release + Debug x86 builds (the shipping configurations)
  # ---------------------------------------------------------------------------------------------
  desktop-build:
    name: Desktop build (Release + Debug x86)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
    - name: Checkout Repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        # Do not leave the GITHUB_TOKEN in .git/config for later steps (npm/nuget/msbuild run third-party code)
        persist-credentials: false

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0

    - name: Setup NuGet
      uses: NuGet/setup-nuget@d105a947828025cd7a980103c35ba2bfae586d0f # v2.0.2
      with:
        # Pinned NuGet CLI version (reproducible restores)
        nuget-version: '6.11.1'

    - name: Cache NuGet packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: desktop/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('desktop/packages.config', 'desktop/RafiqPOS.Tests/packages.config') }}

    # Restore integrity note: packages.config has no lock file / content hashes. Versions are pinned exactly in
    # packages.config and nuget.org packages carry repository signatures that the NuGet CLI validates on restore;
    # the cache key changes whenever either packages.config changes.
    - name: Restore NuGet Packages for C# Host
      run: |
        nuget restore desktop/RafiqPOS.csproj -PackagesDirectory desktop/packages
        nuget restore desktop/RafiqPOS.Tests/RafiqPOS.Tests.csproj -PackagesDirectory desktop/packages

    - name: Verify NuGet DLL SHA-256 pins
      shell: powershell
      run: ./installer/verify_nuget_dlls.ps1 -PackagesDir desktop/packages

    - name: Build C# Host (Release x86)
      run: |
        msbuild desktop/RafiqPOS.csproj /p:Configuration=Release /p:Platform=x86 /v:m /m

    # The installer (installer/RafiqPOS_Setup.iss) refuses to build without these; fail here first.
    - name: Verify Release outputs (SQLite3 Multiple Ciphers engine + provider)
      run: |
        $required = @(
          'desktop/bin/Release/RafiqPOS.exe',
          'desktop/bin/Release/RafiqPOS.exe.config',
          'desktop/bin/Release/sqlite3mc.dll',
          'desktop/bin/Release/Microsoft.Data.Sqlite.dll',
          'desktop/bin/Release/SQLitePCLRaw.core.dll',
          'desktop/bin/Release/SQLitePCLRaw.batteries_v2.dll',
          'desktop/bin/Release/SQLite3MC.PCLRaw.provider.dll'
        )
        $missing = @($required | Where-Object { -not (Test-Path -LiteralPath $_) })
        if ($missing.Count -gt 0) { Write-Host "::error::Missing Release outputs: $($missing -join ', ')"; exit 1 }
        Write-Host 'All expected Release outputs are present.'

    # The Debug x86 build of the host is compiled by the desktop-nunit and desktop-selftests jobs below
    # (they need it anyway), so it is not built a third time here.

  # ---------------------------------------------------------------------------------------------
  # NUnit scenarios (Debug x86), sharded across 2 parallel runners.
  # TestBase builds one migrated template database per run and copies it per test with WAL+Sync=Off.
  # Set RAFIQ_TEST_NO_TEMPLATE=1 to force the old run-every-migration-per-test behaviour.
  # Databases are ENCRYPTED by default (shipping behaviour, exercising the native x86 sqlite3mc.dll); RAFIQ_TEST_PLAIN=1 would run plain.
  # ---------------------------------------------------------------------------------------------
  desktop-nunit:
    name: Desktop tests (NUnit ${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
        - shard: '1-of-2'
          filter: 'class =~ S[0-4]'
        - shard: '2-of-2'
          filter: 'class !~ S[0-4]'
    env:
      TEST_RESULTS_DIR: ${{ github.workspace }}\test-results
    steps:
    - name: Checkout Repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        # Do not leave the GITHUB_TOKEN in .git/config for later steps (npm/nuget/msbuild run third-party code)
        persist-credentials: false

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0

    - name: Setup NuGet
      uses: NuGet/setup-nuget@d105a947828025cd7a980103c35ba2bfae586d0f # v2.0.2
      with:
        # Pinned NuGet CLI version (reproducible restores)
        nuget-version: '6.11.1'

    - name: Cache NuGet packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: desktop/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('desktop/packages.config', 'desktop/RafiqPOS.Tests/packages.config') }}

    - name: Restore NuGet Packages (host + tests)
      run: |
        nuget restore desktop/RafiqPOS.csproj -PackagesDirectory desktop/packages
        nuget restore desktop/RafiqPOS.Tests/RafiqPOS.Tests.csproj -PackagesDirectory desktop/packages

    - name: Verify NuGet DLL SHA-256 pins
      shell: powershell
      run: ./installer/verify_nuget_dlls.ps1 -PackagesDir desktop/packages

    # Builds desktop/RafiqPOS.csproj (ProjectReference) into desktop/bin/Debug and the tests into
    # desktop/RafiqPOS.Tests/bin/Debug (outside a .sln, MSBuild builds the referenced project with
    # its own defaults, Debug|x86, which is the configuration the self-test flags need). Both projects copy the SQLite3 Multiple Ciphers
    # native engine (sqlite3mc.dll, x86) next to each output; the managed provider loads it from the same folder.
    - name: Build NUnit project + C# Host (Debug x86)
      id: build
      run: |
        msbuild desktop/RafiqPOS.Tests/RafiqPOS.Tests.csproj /p:Configuration=Debug /p:Platform=x86 /v:m

    - name: Verify build outputs
      run: |
        $required = @(
          'desktop/bin/Debug/RafiqPOS.exe',
          'desktop/bin/Debug/RafiqPOS.exe.config',
          'desktop/bin/Debug/sqlite3mc.dll',
          'desktop/bin/Debug/Microsoft.Data.Sqlite.dll',
          'desktop/RafiqPOS.Tests/bin/Debug/RafiqPOS.Tests.dll',
          'desktop/RafiqPOS.Tests/bin/Debug/RafiqPOS.Tests.dll.config',
          'desktop/RafiqPOS.Tests/bin/Debug/RafiqPOS.exe',
          'desktop/RafiqPOS.Tests/bin/Debug/sqlite3mc.dll',
          'desktop/packages/NUnit.ConsoleRunner.3.16.3/tools/nunit3-console.exe'
        )
        $missing = @($required | Where-Object { -not (Test-Path -LiteralPath $_) })
        if ($missing.Count -gt 0) { Write-Host "::error::Missing build outputs: $($missing -join ', ')"; exit 1 }
        Write-Host 'All expected build outputs are present.'

    - name: Run NUnit tests (x86)
      timeout-minutes: 25
      run: |
        New-Item -ItemType Directory -Force -Path $env:TEST_RESULTS_DIR | Out-Null
        & desktop/packages/NUnit.ConsoleRunner.3.16.3/tools/nunit3-console.exe `
          desktop/RafiqPOS.Tests/bin/Debug/RafiqPOS.Tests.dll `
          --x86 `
          --where "${{ matrix.filter }}" `
          --labels=Before `
          --work="$env:TEST_RESULTS_DIR" `
          "--result=$env:TEST_RESULTS_DIR\TestResult.xml;format=nunit3"
        # nunit3-console: 0 = all passed, >0 = number of failed tests, <0 = runner/load error.
        $code = $LASTEXITCODE
        if ($code -ne 0) { Write-Host "::error title=NUnit::nunit3-console exited with $code" }
        exit $code

    # Shows where NUnit time goes (slowest tests) in the job summary so the suite can be tuned with data.
    - name: Summarise slowest NUnit tests
      if: always()
      run: |
        $f = Join-Path $env:TEST_RESULTS_DIR 'TestResult.xml'
        if (Test-Path -LiteralPath $f) {
          [xml]$x = Get-Content -LiteralPath $f
          $cases = @($x.SelectNodes('//test-case'))
          $top = $cases | Sort-Object { [double]$_.duration } -Descending | Select-Object -First 15
          $lines = @('### Slowest NUnit tests', '', "Total: $($cases.Count) tests, $([math]::Round([double]$x.'test-run'.duration, 1)) s", '', '| Test | Seconds |', '|---|---|')
          foreach ($t in $top) { $lines += "| $($t.fullname) | $([math]::Round([double]$t.duration, 2)) |" }
          $lines -join [Environment]::NewLine | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
        }

    - name: Upload test results and logs
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: desktop-nunit-results-${{ matrix.shard }}
        path: |
          test-results/
          desktop/RafiqPOS.Tests/bin/Debug/logs/
        if-no-files-found: warn
        retention-days: 14

  # ---------------------------------------------------------------------------------------------
  # In-app self-test suites (Debug x86 flags: RafiqPOS.exe --run-<suite>-tests), sharded across parallel
  # runners. Each suite runs from a fresh copy of desktop/bin/Debug (clean data\, logs\) with a per-suite
  # timeout; any non-zero exit code or timeout fails the shard. Shards are balanced by estimated size;
  # adjust them from the per-suite seconds shown in each shard's summary.
  # The printer/label shard is NON-BLOCKING: it touches Windows printing/GDI and hosted runners have no
  # physical printer, so failures are reported but do not fail the workflow.
  # ---------------------------------------------------------------------------------------------
  desktop-selftests:
    name: Self-tests (${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: ${{ !matrix.blocking }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - shard: A
          blocking: true
          timeout: 15
          suites: 'ruthless-audit,license,update,export,variant,internal-barcode,batch,shift'
        - shard: B
          blocking: true
          timeout: 15
          suites: 'senior-stress,bulk-price,data-quality,sales-completion,controlled-drug,inventory,purchases,baseline'
        - shard: C
          blocking: true
          timeout: 15
          suites: 'master-edge,domain-stress,shift-audit,customer,location,pharma,insurance,unit'
        - shard: D
          blocking: true
          timeout: 15
          suites: 'comprehensive,forensic-audit,excel,migration,reports,audit,deep-audit,chaos'
        - shard: printer-label
          blocking: false
          timeout: 8
          suites: 'printer,label'
    env:
      TEST_RESULTS_DIR: ${{ github.workspace }}\test-results
    steps:
    - name: Checkout Repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        # Do not leave the GITHUB_TOKEN in .git/config for later steps (npm/nuget/msbuild run third-party code)
        persist-credentials: false

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0

    - name: Setup NuGet
      uses: NuGet/setup-nuget@d105a947828025cd7a980103c35ba2bfae586d0f # v2.0.2
      with:
        # Pinned NuGet CLI version (reproducible restores)
        nuget-version: '6.11.1'

    - name: Cache NuGet packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: desktop/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('desktop/packages.config', 'desktop/RafiqPOS.Tests/packages.config') }}

    - name: Restore NuGet Packages (host)
      run: nuget restore desktop/RafiqPOS.csproj -PackagesDirectory desktop/packages

    - name: Verify NuGet DLL SHA-256 pins
      shell: powershell
      run: ./installer/verify_nuget_dlls.ps1 -PackagesDir desktop/packages

    # The self-test flags exist only in a Debug build (#if DEBUG in Program.cs).
    - name: Build C# Host (Debug x86)
      id: build
      run: msbuild desktop/RafiqPOS.csproj /p:Configuration=Debug /p:Platform=x86 /v:m /m

    - name: Verify build outputs
      run: |
        $required = @('desktop/bin/Debug/RafiqPOS.exe', 'desktop/bin/Debug/RafiqPOS.exe.config', 'desktop/bin/Debug/sqlite3mc.dll', 'desktop/bin/Debug/Microsoft.Data.Sqlite.dll')
        $missing = @($required | Where-Object { -not (Test-Path -LiteralPath $_) })
        if ($missing.Count -gt 0) { Write-Host "::error::Missing build outputs: $($missing -join ', ')"; exit 1 }
        Write-Host 'All expected build outputs are present.'

    - name: Run self-test suites (shard ${{ matrix.shard }})
      timeout-minutes: 50
      run: >-
        ./.github/workflows/scripts/Invoke-RafiqSelfTests.ps1
        -Title 'Self-test suites (shard ${{ matrix.shard }})'
        -AppDir desktop/bin/Debug
        -WorkRoot "$env:RUNNER_TEMP\rafiq-selftests"
        -ArtifactDir "$env:TEST_RESULTS_DIR\selftests"
        -TimeoutMinutes ${{ matrix.timeout }}
        -Suites '${{ matrix.suites }}'

    - name: Upload test results and logs
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: desktop-selftest-results-${{ matrix.shard }}
        path: |
          test-results/
          desktop/bin/Debug/logs/
        if-no-files-found: warn
        retention-days: 14
