name: Rafiq POS CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: frontend/package.json

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Frontend Dependencies & Linting
      run: |
        cd frontend
        npm ci
        npm run lint
        npm run build

    - name: Frontend Test Suite
      run: |
        cd frontend
        npm test

    - name: License Server Tests
      run: |
        cd license-server
        npm ci
        npm test

    - name: Restore NuGet Packages for C# Host
      run: |
        nuget restore desktop/RafiqPOS.csproj -PackagesDirectory desktop/packages
        nuget restore desktop/RafiqPOS.Tests/RafiqPOS.Tests.csproj -PackagesDirectory desktop/packages

    - name: Build C# Host (Release x86)
      run: |
        msbuild desktop/RafiqPOS.csproj /p:Configuration=Release /p:Platform=x86 /v:m

    - name: Build C# Host (Debug x86)
      run: |
        msbuild desktop/RafiqPOS.csproj /p:Configuration=Debug /p:Platform=x86 /v:m

